name: Package Skills

on:
  workflow_dispatch:
    inputs:
      format:
        description: '压缩包格式'
        required: true
        type: choice
        options:
          - tgz
          - zip

jobs:
  build:
    name: Package all skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build archives
        run: |
          FORMAT="${{ github.event.inputs.format }}"
          if [ "$FORMAT" = "tgz" ]; then
            COMPRESS_FLAG="z"
            OUTER_EXT="tgz"
          else
            COMPRESS_FLAG=""
            OUTER_EXT="zip"
          fi

          OUTER_NAME="wl-xiang_skills.${OUTER_EXT}"
          STAGING="$(mktemp -d)"
          mkdir -p "$STAGING"

          echo "── Packaging skills ──"
          SKILL_COUNT=0
          for dir in skills/*/; do
            [ -d "$dir" ] || continue
            NAME="$(basename "$dir")"
            INNER="${NAME}.${OUTER_EXT}"

            if [ "$FORMAT" = "tgz" ]; then
              tar -c${COMPRESS_FLAG}f "$STAGING/$INNER" -C skills "$NAME"
            else
              (cd skills && zip -qr "$STAGING/$INNER" "$NAME")
            fi

            echo "  ✓ $INNER"
            SKILL_COUNT=$((SKILL_COUNT + 1))
          done

          if [ "$SKILL_COUNT" -eq 0 ]; then
            echo "::error::No skill folders found under skills/." >&2
            exit 1
          fi

          echo ""
          echo "Total skills packaged: $SKILL_COUNT"

          # Build outer archive containing all per-skill archives
          if [ "$FORMAT" = "tgz" ]; then
            tar -cf "$OUTER_NAME" -C "$STAGING" .
          else
            (cd "$STAGING" && zip -qr "$OLDPWD/$OUTER_NAME" .)
          fi

          echo ""
          echo "── Result ──"
          ls -lh "$OUTER_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wl-xiang_skills
          path: wl-xiang_skills.${{ github.event.inputs.format == 'tgz' && 'tgz' || 'zip' }}
          if-no-files-found: error
